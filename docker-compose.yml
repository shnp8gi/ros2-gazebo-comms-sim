# =============================================================================
# Base Configuration (Works on any CPU/GPU host)
# =============================================================================
services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros2-gazebo-comms-sim:humble-harmonic
    container_name: comms_sim
    
    environment:
      - DISPLAY=${DISPLAY}
      - GZ_SIM_RESOURCE_PATH=/workspace/models
      - ROS_DOMAIN_ID=0

    volumes:
      - .:/workspace:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - gz_cache:/root/.gz
    
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /workspace

    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        if [ -f /workspace/install/setup.bash ]; then
          source /workspace/install/setup.bash
        fi &&
        echo 'ROS 2 + Gazebo Harmonic environment ready' &&
        bash
      "

  build:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros2-gazebo-comms-sim:humble-harmonic
    container_name: comms_sim_build
    volumes:
      - .:/workspace:rw
    working_dir: /workspace
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        cd /workspace &&
        colcon build --symlink-install &&
        echo 'Build completed successfully!'
      "

volumes:
  gz_cache:
    name: gazebo_harmonic_cache
