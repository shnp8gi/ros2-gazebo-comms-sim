sweep:
  name: urban_ablation_smoke
  description: RSU2基・競合条件。アブレーション4種 + A3標準ベースライン x N=10
  scenario: config/scenarios/road_urban_2lane.yaml
  variables:
  - name: method
    cases:
      a3:
        config:
          link_controller_node.ros__parameters.control_plane: a3
      kkf_cold:
        config:
          link_controller_node.ros__parameters.control_plane: kkf_mpc
          link_controller_node.ros__parameters.kkf_lookahead_stages: 1
          link_controller_node.ros__parameters.kkf_state_dir: ''
  - name: load
    cases:
      moderate: {}
  analysis:
    group_by:
    - method
    - load
    arm_var: method
    baseline: kkf_cold
    metrics:
    - total_data_MB
    - connected_time_s
    - jain_index
    - nlos_grant_pct
    - path_mean_MB
    - path_min_MB
    - path_zero_pct
    - n_paths
  execution:
    num_runs: 1
    base_seed: 12345
    task_timeout_sec: 900
    real_time_factor: 2.0
    max_concurrency: 2
    output_name: urban_ablation_smoke
