# 検証用: run毎シード導出 (CRN) の動作確認 (1タスク × 2run)
sweep:
  name: "verify_run_seeds"
  description: "run毎シード注入の検証"
  scenario: "config/scenarios/ts_kf_test.yaml"
  variables:
    - name: "synchronized_antenna_yaw"
      targets:
        - entity_role: "rx"
          field: "antennas.*.relative_rpy[2]"
          unit: "degree"
          range: { start: 0.0, end: 0.0, step: 10.0 }
  execution:
    num_runs: 2
    task_timeout_sec: 600
    real_time_factor: 5.0
    max_concurrency: 2
