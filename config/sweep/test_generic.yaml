sweep:
  name: "generic_test"
  description: "Test generic variables"
  scenario: "config/scenarios/example_multi_model.yaml"
  variables:
    - name: "rx_antenna_yaw"
      target:
        entity_role: "rx"
        field: "antennas.*.relative_rpy[2]"
      range:
        start: 0.0
        end: 90.0
        step: 45.0
    - name: "suv_speed"
      target:
        entity_name: "suv_1"
        field: "waypoints.*[3]"
      values: [10.0, 20.0]
  execution:
    num_runs: 1
    task_timeout_sec: 120
    real_time_factor: 5.0
    max_concurrency: 2
    base_station_yaw_deg: 0.0
