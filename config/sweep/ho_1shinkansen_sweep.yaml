# 新規作成したHO (feedforward_optimal) 用のスイープ設定ファイル
sweep:
  name: "ho_angle_sweep_0_to_180"
  description: "基地局アンテナ角度スイープ (0〜180度, 1度刻み) - feedforward_optimal"
  
  # 新しく設定が追加されたシナリオファイルを指定
  scenario: "config/scenarios/1shinkansen_mount3antenna_3bs.yaml"
  
  # スイープ変数の定義
  variables:
    - name: "synchronized_antenna_yaw"
      description: "アンテナ角度の同期スイープ"
      targets:
        - entity_role: "rx"
          field: "antennas.*.relative_rpy[2]"
          unit: "degree"
          range:
            start: -90.0
            end: 90.0
            step: 1.0
        - entity_role: "tx"
          field: "antennas.*.relative_rpy[2]"
          unit: "degree"
          range:
            start: 0.0
            end: 180.0
            step: 1.0

    - name: "rx_y_position"
      description: "基地局のY位置"
      target:
        entity_role: "rx"
        field: "pose[1]"
      values: [3.0]     

  # スイープ実行設定
  execution:
    num_runs: 1
    task_timeout_sec: 600
    real_time_factor: 5.0
    max_concurrency: 4
    base_station_yaw_deg: -90.0
