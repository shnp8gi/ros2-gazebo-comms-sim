# デフォルトのスイープ設定ファイル
sweep:
  name: "angle_sweep_default_small"
  description: "基地局アンテナ角度スイープ (小規模テスト用)"
  
  # ベースとなるシナリオファイル
  scenario: "config/scenarios/1shinkansen_mount3antenna_3bs.yaml"
  
  # スイープ変数の定義
  variables:
    - name: "synchronized_antenna_yaw"
      description: "アンテナ角度の同期スイープ"
      targets:
        - entity_role: "rx"
          field: "antennas.*.relative_rpy[2]"
          unit: "degree"
          range:
            start: -90.0
            end: 90.0
            step: 45.0
        - entity_role: "tx"
          field: "antennas.*.relative_rpy[2]"
          unit: "degree"
          range:
            start: 0.0
            end: 180.0
            step: 45.0

    - name: "rx_y_position"
      description: "基地局のY位置"
      target:
        entity_role: "rx"
        field: "pose[1]"
      values: [3.0]     

  # スイープ実行設定
  execution:
    num_runs: 1
    task_timeout_sec: 600
    real_time_factor: 5.0
    max_concurrency: 4
