# 都市部2車線シナリオ (仕様 docs/urban_2lane_scenario_spec.md)。
# tools/gen_urban_scenario.py により生成 — 手編集より再生成を推奨:
#   python3 tools/gen_urban_scenario.py --out config/scenarios/road_urban_2lane.yaml
# 角度規約: RSU yaw = -90°+δ_rsu (下流へ) / 車 relative yaw = ±δ_veh (走行方向で反転)
#   δ_rsu < 0 (上流へ振る) = 下り車を担当 / δ_rsu > 0 = 上り車を担当
# traffic: は run 毎に tools/lib/traffic_gen.py が対象車(tx)と一般車(blocker)へ展開する
scenario:
  name: road_urban_2lane
  description: 都市部 片側1車線×1車線・対象車と一般車の混在交通 (target_ratio で分離)。RSU 2台 10.0m間隔 y=6.00 (歩道外側端)、傾き ±70.0° (alternate)
    / 車 ±20.0°。δ_rsu+δ_veh=90° (相互ボアサイト成立)。tools/gen_urban_scenario.py により生成
  base_config: src/comms_sim_pkg/config/sim_params.yaml
  # max_sim_time_s: 全車の完走を待つだけでは、1台でも完走できない車両が
  # あると走行が終わらない (実測: 20走行中9走行が停止せず、シム時刻3245秒
  # まで走り続けた)。シム時刻で判定するので計算機の速度によらず同じ地点で止まる
  simulation_overrides: {headless: true, max_sim_time_s: 90.0, real_time_factor: 2.0, logging_level: 3, physics_max_step_size: 0.001}
  config_overrides:
    link_controller_node:
      ros__parameters:
        scheduling_policy: external_schedule
        control_plane: kkf_mpc
        schedule_topic: /comms/ho_schedule
        ff_max_pairs: 1
        assoc_recover_timeout_s: 0.2
        export_rssi_profile: true
        kkf_use_prior: false
        kkf_assigner: hungarian
        kkf_switch_bonus_db: 3.0
        kkf_replan_period_s: 0.05
        # 制御プレーンをシム時刻のエポックに同期させる。非同期のままだと計画が
        # 効き始めるシム時刻が計算機の混み具合で変わり、外部プロセスで動く手法
        # だけが負荷で不利になる (実測: KKFノード4個同時で grant -4.6%、
        # プラグイン内で完結する assoc_hold は +2.6%)。手法間の差 (5-14%) と
        # 同程度の交絡になるため同期は必須
        # 事後再計算 (tools/replay_sim.py) に切り替えたため既定は無効。
        # lockstep は競合条件で散発的にデッドロックし、実用に至らなかった
        kkf_lockstep: false
        kkf_lookahead_stages: 1
        kkf_lookahead_discount: 0.7
        kkf_stale_report_s: 1.0
        kkf_directions: [-1, 1]
        kkf_road_x_range: [-105.0, 105.0]
        kkf_rbf_s_min: 0.0
        kkf_rbf_s_max: 210.0
        kkf_horizon_s: 4.0
        kkf_plan_dt_s: 0.1
        kkf_kappa: 1.0
        kkf_idle_lcb_db: -68.5
        kkf_mean_prior_dbm: -110.0
        kkf_basis: rbf
        kkf_rbf_num_bases: 40
        kkf_rbf_width_m: 0.0
        kkf_sigma_nu_db: 4.0
        kkf_corr_length_s_m: 20.0
        kkf_corr_length_t_s: 5.0
        kkf_varmap_enabled: true
        kkf_varmap_grid_m: 2.0
        kkf_varmap_prior_var_db2: 0.0
        kkf_state_dir: ''
        kkf_state_save: false
        kkf_q_forget: 0.05
        kkf_state_gamma: 0.997
        kkf_tracker_enabled: false
        tskf_process_noise_q: 25.0
        tskf_prior_mean_dbm: -120.0
        tskf_prior_var: 400.0
    comms_simulator_node:
      ros__parameters:
        tx_power: -7.0
        comms_update_period_s: 0.005
        link_eval_radius_m: 100.0
        rate_model: {type: shannon, bandwidth_hz: 100000000.0, noise_floor_dbm: -95.0, efficiency: 1.0,
          snr_min_db: 26.5, snr_cap_db: 50.0}
        channel:
          seed: 42
          blockage: {enabled: true, max_total_loss_db: 60.0}
          shadowing: {enabled: true, type: frozen, sigma_db: 4.0, corr_length_m: 6.0, environment_seed: 1,
            grid_m: 1.5, axis: x, u_min: -65.0, u_max: 65.0}
          fading: {enabled: false}
        measurement_report: {enabled: true, period_s: 0.05, noise_std_db: 2.0, observe_all_pairs: false,
          seed: 123}
  model_catalog:
    antenna:
      sdf_path: models://antenna
      description: 沿道RSUアンテナ (歩道外側端のポール)
      default_antenna_offset: [0.0, 0.0, 2.5]
    # 走行する車両には遮蔽属性を与えない。移動体による遮蔽は走行のたびに配置が
    # 変わるため環境の性質ではなく、位置を鍵にした地図では捉えられない。
    # (車高 1.5m は RSU 2.5m と車載 1.35m を結ぶ視線 (最低 1.58m) の下を通るため
    #  元々ほとんど遮っていなかったが、幾何に依存する偶然なので明示的に外す)
    Car:
      sdf_path: models://GhostBox
      description: 配信対象の乗用車 (車高1.5m)。遮蔽体としては扱わない
      default_antenna_offset: [0.0, 0.0, 1.35]
    SedanBlocker:
      sdf_path: models://GhostBox
      description: 走行する乗用車 (車高1.5m)。遮蔽体としては扱わない
    MinivanBlocker:
      sdf_path: models://GhostBox
      description: ミニバン・SUV (車高1.9m、視線を遮る境界クラス)
      blockage:
        size: [4.8, 1.8, 1.9]
        loss_db: 12.0
    TruckBlocker:
      sdf_path: models://GhostBox
      description: トラック (車高3.8m)
      blockage:
        size: [12.0, 2.5, 3.8]
        loss_db: 26.0
    BusBlocker:
      sdf_path: models://GhostBox
      description: バス (車高3.2m)
      blockage:
        size: [11.0, 2.5, 3.2]
        loss_db: 22.0
    ParkedVan:
      sdf_path: models://GhostBox
      description: 路上駐車のバン (車高2.4m)。RSU(2.5m)と車載(1.35m)を結ぶ視線が
        駐車帯 (y=+4.0) を横切る高さは車両位置によらず 2.20m なので、
        2.4m は視線をわずかに超えて浅く遮る
      blockage:
        # ミリ波帯において車両による遮蔽損失は一般に 20〜40 dB とされる。
        # 14 dB では余裕を食い切らずリンクが切れないため (実測: 接続可能な点の
        # 52% が NLOS のままだった)、現実的な範囲に置く
        size: [5.2, 2.0, 2.4]
        loss_db: 22.0
    ParkedTruck:
      sdf_path: models://GhostBox
      description: 路上駐車のトラック (車高3.2m)。位置が固定された遮蔽体
      blockage:
        size: [7.5, 2.4, 3.2]
        loss_db: 32.0
  traffic:
    seed: 0
    window_s: [0.0, 60.0]
    warmup_s: 5.0
    prefill: auto
    interleave_arrivals: true
    corridor: [-45.0, 45.0]
    margin_m: 30.0
    max_vehicles: 400
    target_ratio: 1.0    # 全車が通信対象 (遮蔽専用の一般車を出さない)
    target_template:
      model: Car
      antenna_offset: [0.0, 0.0, 1.35]
      relative_yaw_by_direction: &id001 {'1': 0.349066, '-1': -0.349066}
      antennas:
      - suffix: front
        offset: [0.0, 0.0, 1.35]
        relative_yaw_by_direction: *id001
      - suffix: rear
        offset: [0.0, 0.0, 1.35]
        relative_yaw_by_direction: {'1': 2.792527, '-1': -2.792527}
    tx_entry_jitter_s: 0.0
    # 移動体による遮蔽は行わない。走行のたびに配置が変わる遮蔽は環境の性質では
    # なく、位置を鍵にした地図では捉えられないため (実測: 学習した平均場を持つ
    # 構成が、走行内観測のみの構成に有意に劣った)。
    # 遮蔽は entities に置いた固定物 (路上駐車) が担う
    vehicle_mix:
    - {model: SedanBlocker, ratio: 1.0, can_be_target: true}
    lanes:
    - y: 1.75
      direction: 1
      speed_mps: 16.7
      headway_s: {dist: lognormal, mean: 5.0, sigma: 0.6, min: 1.0}
    - y: -1.75
      direction: -1
      speed_mps: 16.7
      headway_s: {dist: lognormal, mean: 5.0, sigma: 0.6, min: 1.0}
  entities:
  - name: rsu_0
    model: antenna
    role: rx
    static: true
    pose: [-5.0, 6.0, 0.0, 0.0, 0.0, -2.792527]
    antennas:
    - name: rsu_0
      offset: [0.0, 0.0, 2.5]
      relative_rpy: [0.0, 0.0, 0.0]
  - name: rsu_1
    model: antenna
    role: rx
    static: true
    pose: [5.0, 6.0, 0.0, 0.0, 0.0, -0.349066]
    antennas:
    - name: rsu_1
      offset: [0.0, 0.0, 2.5]
      relative_rpy: [0.0, 0.0, 0.0]
  # --- 固定遮蔽 (路上駐車) ---
  # RSU (y=+6.0, z=2.5) から下り車線 (y=-1.75, z=1.35) への視線が駐車帯
  # (y=+4.0) を横切る高さは、車両位置によらず 2.20m である
  # (y と z が同じ媒介変数で線形補間されるため)。したがって車高 2.2m 以上の
  # 車両のみが遮蔽体として機能する。
  #
  # 視線が駐車帯を横切る x の範囲は概ね -14〜+14 (幅 28m)。実際の路上駐車は
  # 連続ではなく間欠的なので、この範囲の 3 割程度を占める配置とする。
  # 左右非対称にして、RSU 0 側と RSU 1 側で遮蔽の様子を変えている
  # (対称だとどちらの RSU を選んでも同じになり、割当の判断材料にならない)
  - {name: park_0, model: ParkedTruck, role: blocker, static: true,
     pose: [-9.0, 4.0, 0.0, 0.0, 0.0, 0.0]}
  - {name: park_1, model: ParkedVan,   role: blocker, static: true,
     pose: [7.0, 4.0, 0.0, 0.0, 0.0, 0.0]}
