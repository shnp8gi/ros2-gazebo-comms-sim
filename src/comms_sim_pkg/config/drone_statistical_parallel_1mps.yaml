# ② BER/PERモデル。波形モデルとMACを共用。実測未校正の動作確認用設定。
scenario: parallel
antenna_mode: fixed
drone_a:
  speed_kmh: 3.6
  altitude_m: 20.0
  fixed_elevation_deg: 45.0
drone_b:
  speed_kmh: 3.6
  altitude_m: 30.0
  fixed_elevation_deg: -45.0
lateral_separation_m: 10.0
encounter_time_s: 25.0
duration_s: 50.0
radio_ab:
  frequency_hz: 60.48e9
  power_mw: 0.15848931924611134
  sensitivity_dbm: -68.5
  tx_antenna_gain_dbi: 23.0
  rx_antenna_gain_dbi: 23.0
  tx_insertion_loss_db: 3.0
  rx_lna_gain_db: 0.0
  rx_conversion_gain_db: 0.0
  rx_insertion_loss_db: 3.0
  noise_temperature_k: 300.0
  noise_bandwidth_hz: 2.1648e9
  receiver_noise_figure_db: 0.0
  required_snr_db: null
radio_ba:
  frequency_hz: 271.08e9
  power_mw: 0.7943282347242815
  sensitivity_dbm: -68.5
  tx_antenna_gain_dbi: 24.0
  rx_antenna_gain_dbi: 24.0
  tx_insertion_loss_db: 0.0
  rx_lna_gain_db: 25.0
  rx_conversion_gain_db: 3.0
  rx_insertion_loss_db: 3.0
  noise_temperature_k: 300.0
  noise_bandwidth_hz: 2.1648e9
  receiver_noise_figure_db: 10.0
  required_snr_db: null
propagation:
  exponent: 2.0
antenna:
  e_plane: e_plane.csv
  h_plane: h_plane.csv
  max_attenuation_db: 30.0
mcs_table: MCStable.csv
awgn:
  enabled: false
  seed: 20261027
  bit_rate_bps: 3.52e9
  control_frame_bytes: 64
protocol:
  data_from_prc: true         # B(PRC)→A(PRDEV)でデータ送信。逆方向は受領確認。
  response_timeout_ms: 500.0
  ack_timeout_ms: 500.0
  inactivity_timeout_ms: 500.0
  beacon_interval_ms: 0.14
  control_frame_us: 20.0
  ifs_us: 10.0
  data_frame_us: 100.0
simulation:
  physics_step_s: 0.01
  real_time_factor: 20.0
  log_interval_s: 0.01
lab_phy:
  enabled: false
hrcp:
  enabled: true
  data_bytes: 2048
  atp_ms: 10000 # 資料の既定値。実機のMU_TJX_ATPに合わせて変更する。
  setup_timeout_ms: 500
  expected_rssi_admission_enabled: false
  association_reference_distance_m: 30.0
  monitor_enabled: true
  monitor_waveforms: false
  noise_threads: 4
  monitor_rssi_interval_s: 0.01
  decode_threads: 4
preview_mode: false
monitor_only: false
empirical_phy:
  enabled: true
  table: receiver_curve_demo.csv
  metric: ber                         # ber または per
  per_length_policy: exact            # per時のみ。長さ違いを近似する場合はindependentを明示
  calibration_status: synthetic_demo  # 実測値へ差し替え後はmeasured_unvalidated等へ変更
  seed: 20261029
  control_mcs: 0
  rssi_offset_ab_db: 0.0              # 曲線を参照する電力への補正。正なら受信しやすくなる
  rssi_offset_ba_db: 0.0
  mcs_by_rate_gbps: {0.5: 0, 1.1: 3, 2.15: 6, 2.7: 8, 4.6: 9, 6.0: 11}
